<text x="600" y="80" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="15" font-weight="400" fill="#8f8fa3">任何一次故障都能归到其中一格</text>
<rect x="60" y="120" width="520" height="180" rx="10" fill="#14141c" stroke="#2a2a3a" stroke-width="1"/><text x="320.0" y="204.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="19" font-weight="600" fill="#e8e8ef">任务与控制</text><text x="320.0" y="230.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">谁让它做什么 / 允许到哪一步 / 什么情况停</text>
<rect x="620" y="120" width="520" height="180" rx="10" fill="#14141c" stroke="#2a2a3a" stroke-width="1"/><text x="880.0" y="204.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="19" font-weight="600" fill="#e8e8ef">判断与执行</text><text x="880.0" y="230.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">下一步怎么定 / 能力怎么调 / 在哪执行</text>
<rect x="60" y="340" width="520" height="180" rx="10" fill="#14141c" stroke="#2a2a3a" stroke-width="1"/><text x="320.0" y="424.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="19" font-weight="600" fill="#e8e8ef">状态与资料</text><text x="320.0" y="450.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">信息存在哪 / 哪个来源可信 / 更新了什么</text>
<rect x="620" y="340" width="520" height="180" rx="10" fill="#14141c" stroke="#2a2a3a" stroke-width="1"/><text x="880.0" y="424.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="19" font-weight="600" fill="#e8e8ef">观察与改进</text><text x="880.0" y="450.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">怎么知道做对 / 改哪里 / 有没有退化</text>
<circle cx="600" cy="320" r="34" fill="#d4a853"/>
<text x="600" y="327" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="16" font-weight="700" fill="#0a0a0f">模型</text>
