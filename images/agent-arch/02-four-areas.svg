<text x="600" y="596" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" font-weight="400" fill="#8f8fa3">恢复问题→影响任务持续 · 评测问题→影响验收</text>
