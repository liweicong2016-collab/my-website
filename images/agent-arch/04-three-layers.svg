<text x="600" y="285" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="15" font-weight="400" fill="#8f8fa3">组织可复用的方法与判断标准</text>
<text x="600" y="320" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" font-weight="400" fill="#d4a853">阈值、例外、证据要求</text>
