<text x="600" y="80" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="15" font-weight="400" fill="#8f8fa3">不是互斥，是分工</text>
