<rect x="60" y="420" width="1080" height="110" rx="10" fill="#1b1b26" stroke="#d4a853" stroke-width="2"/><text x="600.0" y="469.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="19" font-weight="600" fill="#e8e8ef">「薄 Harness 厚 Skills」的真实含义</text><text x="600.0" y="495.0" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">Harness 越薄，模型越自由；Skills 越厚，判断越可靠。自由与可靠之间的张力，就是全部设计空间</text>
