<rect x="430.0" y="313.0" width="340" height="74" rx="10" fill="#14141c" stroke="#2a2a3a" stroke-width="1"/><text x="600" y="343" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="18" font-weight="600" fill="#e8e8ef">程序校验</text><text x="600" y="368" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">参数 / 权限 / 前置条件</text>
<rect x="430.0" y="413.0" width="340" height="74" rx="10" fill="#14141c" stroke="#2a2a3a" stroke-width="1"/><text x="600" y="443" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="18" font-weight="600" fill="#e8e8ef">执行</text><text x="600" y="468" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">业务系统 / 文件 / 网络</text>
<path d="M600,187 L600,213" stroke="#d4a853" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M600,287 L600,313" stroke="#d4a853" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M600,387 L600,413" stroke="#d4a853" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="430.0" y="523.0" width="340" height="74" rx="10" fill="#14141c" stroke="#2a2a3a" stroke-width="1"/><text x="600" y="553" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="18" font-weight="600" fill="#e8e8ef">结果检查</text><text x="600" y="578" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">够不够？对不对？要不要继续？</text>
