<text x="232" y="405" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#d4a853">否 · 继续补查</text>
<text x="232" y="425" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="12" font-weight="400" fill="#8f8fa3">（回环，不是重来）</text>
<rect x="430.0" y="635.0" width="340" height="74" rx="10" fill="#1b1b26" stroke="#d4a853" stroke-width="2"/><text x="600" y="665" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="18" font-weight="600" fill="#e8e8ef">等待人工确认</text><text x="600" y="690" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">授权 / 改要求 / 中止</text>
