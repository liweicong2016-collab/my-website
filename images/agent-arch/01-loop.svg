<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
<defs>
<marker id="a" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#d4a853"/></marker>
<marker id="g" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#8f8fa3"/></marker>
</defs>
<rect width="1200" height="980" fill="#0a0a0f"/>
<text x="600" y="54" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="25" font-weight="700" fill="#e8e8ef">一次 Agent 执行的完整循环</text>
<text x="600" y="84" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="15" fill="#8f8fa3">模型判断与程序执行交替推进 · 人工只在关键点介入</text>

