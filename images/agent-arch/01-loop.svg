<text x="690" y="620" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#d4a853">是 · 满足目标</text>
<rect x="430.0" y="745.0" width="340" height="74" rx="10" fill="#14141c" stroke="#2a2a3a" stroke-width="1"/><text x="600" y="775" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="18" font-weight="600" fill="#e8e8ef">执行副作用</text><text x="600" y="800" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">发消息 / 改订单 / 付款</text>
<path d="M600,709 L600,745" stroke="#d4a853" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="430.0" y="855.0" width="340" height="74" rx="10" fill="#1b1b26" stroke="#d4a853" stroke-width="2"/><text x="600" y="885" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="18" font-weight="600" fill="#e8e8ef">核验回执</text><text x="600" y="910" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="14" fill="#8f8fa3">业务状态才是事实</text>
<path d="M600,819 L600,855" stroke="#d4a853" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="880" y="890" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif" font-size="13" font-weight="400" fill="#d4a853">唯一算数的在这里</text>
