<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喷嚏晚报 — Livius's Tech Pulse</title>
<meta name="description" content="每天20点：喷嚏图卦每日时评 + X时间线晚间精选。">
<style>
:root{--bg:#08090c;--surface:#101116;--border:rgba(255,255,255,.08);--text:#f4f4f5;--text2:#a1a1aa;--text3:#5b5e6b;--accent:#b45309;--accent-hi:#f59e0b;--accent-dim:rgba(245,158,11,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 22px 90px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--border);margin-bottom:34px}
.topbar a.back{color:var(--text2);font-size:13.5px}.topbar a.back:hover{color:var(--text)}
.badge{display:inline-block;font-size:12px;font-weight:700;color:#fcd34d;border:1px solid rgba(245,158,11,.4);background:var(--accent-dim);border-radius:999px;padding:5px 14px;margin-bottom:18px}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-1px;margin-bottom:10px}
.sub{color:var(--text2);font-size:15px;margin-bottom:34px}
.edition{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:12px;transition:border-color .15s}
.edition:hover{border-color:rgba(245,158,11,.5)}
.edition .d{font-size:16px;font-weight:700}
.edition .s{font-size:13px;color:var(--text3);margin-top:4px}
.edition .go{color:var(--accent-hi);font-size:14px;font-weight:600;white-space:nowrap}
.soon{text-align:center;color:var(--text3);padding:50px 0;font-size:15px;line-height:2}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" href="../../">← 首页</a><a class="back" href="../x-morning/">☀ X早报</a></div>
  <span class="badge">每日 20:00（胡志明时间）更新</span>
  <h1>喷嚏晚报</h1>
  <div class="sub">喷嚏图卦每日时评 + 喷嚏网精彩内容 + X 时间线晚间精选 + 关心话题新进展。</div>
  <!-- EDITIONS -->
  <div class="soon">首期今晚 20:00 见。<br>在此之前，可以先看看 <a href="../x-morning/" style="color:var(--accent-hi)">☀ X早报</a>。</div>
</div>
</body>
</html>
