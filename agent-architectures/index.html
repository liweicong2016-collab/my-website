"nodes": ["tool", "mcp"]}, {"title": "编排任务依赖", "example": "先确认时段，再预订会议室，随后发送邀请与附件。", "output": "带负责人和依赖关系的任务计划", "nodes": ["planner", "thinking"]}, {"title": "处理必要审批", "example": "若会议室需要负责人审批，保存流程状态并等待回复。", "output": "审批通过后继续；等待状态可恢复", "nodes": ["specific"]}, {"title": "执行预约与通知", "example": "预约“会议室 A”，发送邀请；同一请求使用幂等键。", "output": "预约 ID、邀请回执与发送记录", "nodes": ["action", "input", "tool"]}, {"title": "核对实际结果", "example": "通知接口超时后先查发送记录，再决定是否重试。", "output": "确认预约和通知成功，避免重复发送", "nodes": ["reflect"]}, {"title": "整理会议纪要", "example": "依据会议材料记录：李明周五交付原型，王颖补充预算。", "output": "含决策、负责人、期限的纪要草稿", "nodes": ["action", "tool"]}, {"title": "校验并按授权分发", "example": "核对纪要与原始记录，将确认版本发送给参会人。", "output": "纪要版本、文档地址与分发回执", "nodes": ["reflect", "tool"]}, {"title": "汇总与更新状态", "example": "报告会议安排、纪要链接、完成项及仍需人工处理的事项。", "output": "业务结果可追溯，流程进入对应终态", "nodes": ["result", "output"]}]}, {"id": "coding", "cn": "编程", "en": "Coding", "sub": "仓库与验证驱动", "case": "案例：修复无效令牌被误放行的登录接口", "goal": "无效令牌应返回 401，有效令牌保持正常", "plan": "复现 → 定位 → 修改 → 测试 → 评审", "reason": "根据代码、错误日志与基线确定原因", "memory": ["仓库 / 符号 / 编码规范", "缺陷 / 验收条件 / 日志", "起始版本 / 补丁 / 测试"], "core": ["分析调用关系与修复范围", "独立工作区应用补丁", "文件路径 / 命令 / 环境"], "special": "隔离工作区 · 保留已有用户修改", "tools": ["代码检索 / 编辑", "终端 / 构建测试", "Git / 差异检查"], "mcp": ["代码托管平台", "Issue / 文档服务", "CI / 接口服务"], "reflect": "真实测试 · 失败归因 · 回归检查", "result": "补丁、验证证据与 PR 草稿", "steps": [{"title": "明确验收条件", "example": "“无效令牌返回 401；有效令牌访问接口仍返回 200。”", "output": "两个可验证的目标行为", "nodes": ["goal"]}, {"title": "记录仓库基线", "example": "记录起始提交和已有修改，在独立工作区进行任务操作。", "output": "工作区、代码版本和修改保护范围", "nodes": ["memory", "specific"]}, {"title": "检索认证调用链", "example": "定位 auth 中间件、令牌校验函数和对应测试。", "output": "相关文件、符号与调用关系", "nodes": ["memory", "tool"]}, {"title": "复现并确认原因", "example": "示例：校验异常被捕获后仍调用 next()，导致错误放行。", "output": "复现日志和修复范围；实际任务需证据确认", "nodes": ["reason", "tool"]}, {"title": "设计最小修复", "example": "异常分支返回 401 并终止处理，保留有效令牌的正常路径。", "output": "补丁计划与回归验证项", "nodes": ["planner", "thinking"]}, {"title": "应用补丁与回归用例", "example": "修改异常处理，同时新增“无效令牌拒绝访问”的测试。", "output": "版本化代码补丁与必要回归用例", "nodes": ["action", "input", "specific"]}, {"title": "运行真实验证", "example": "执行认证相关测试，再运行修改范围对应的构建与检查。", "output": "退出码、测试结果与必要日志", "nodes": ["tool"]}, {"title": "分析失败并重修", "example": "若有效令牌测试也失败，检查修复是否错误截断正常分支。", "output": "修正补丁后重测，区分代码与环境失败", "nodes": ["reflect", "reason"]}, {"title": "检查差异和证据", "example": "确认补丁未覆盖无关修改，验证结果对应最终代码版本。", "output": "可评审差异、测试证据与未覆盖说明", "nodes": ["reflect", "result"]}, {"title": "准备 PR 与评审反馈", "example": "PR 说明原因、修复行为及测试；CI 或评审反馈再进入修复循环。", "output": "PR 草稿或已授权提交的变更", "nodes": ["output"]}]}, {"id": "video", "cn": "视频", "en": "Video", "sub": "分镜与资产驱动", "case": "案例：制作 15 秒科幻风格智能耳机广告", "goal": "15 秒 · 16:9 · 黑色耳机 · 科幻视觉", "plan": "创意 → 分镜 → 资产 → 生成 → 成片", "reason": "确定镜头依赖、风格与音画节奏", "memory": ["产品参考 / 品牌 / 风格", "镜头设定 / 动作 / 时长", "参数 / 素材 / 镜头版本"], "core": ["镜头编号、时长与依赖", "并发配额、预算与重试", "参考图 / 提示词 / 参数"], "special": "镜头 A…N 并行 · 音轨独立生成", "tools": ["图像 / 视频生成", "配音 / 音乐质检", "剪辑 / 字幕渲染"], "mcp": ["素材 / 资产库", "对象存储服务", "制作任务服务"], "reflect": "逐镜头检查 · 不合格片段重生成", "result": "时间轴合成、成片与素材记录", "steps": [{"title": "明确制作规格", "example": "制作 15 秒、16:9 黑色耳机广告；卖点是降噪与空间音效。", "output": "创作需求、成片规格和卖点清单", "nodes": ["goal"]}, {"title": "形成创意脚本", "example": "“喧嚣都市 → 戴上耳机 → 进入宁静太空 → 产品落版”。", "output": "四段叙事与文案草稿", "nodes": ["planner", "reason"]}, {"title": "拆分镜头与时长", "example": "S1 都市 3 秒；S2 戴耳机 4 秒；S3 太空 5 秒；S4 落版 3 秒。", "output": "镜头任务表，总时长 3+4+5+3=15 秒", "nodes": ["thinking", "planner"]}, {"title": "固定参考资产", "example": "统一黑色机身、银色标识、蓝紫灯光及同一人物参考图。", "output": "可复用的产品、人物和风格资产版本", "nodes": ["memory"]}, {"title": "编写逐镜头生成输入", "example": "S2 示例：“人物侧脸戴上参考耳机，镜头缓慢推近，保持机身形状。”", "output": "每镜头提示词、参考图和支持的生成参数", "nodes": ["input"]}, {"title": "调度镜头生成", "example": "按依赖提交 S1–S4；独立镜头并行，记录任务 ID、预算与配额。", "output": "异步任务状态；实际片段可按模型能力裁剪", "nodes": ["action", "specific", "tool"]}, {"title": "生成配音与音乐", "example": "配音：“隔绝喧嚣，进入你的宇宙。”音乐从城市噪声转为氛围音。", "output": "配音与音乐音轨，供时间轴对齐", "nodes": ["tool"]}, {"title": "逐镜头质检与重生成", "example": "若 S2 耳机变成白色，增加产品约束，仅重做 S2 并检查相邻衔接。", "output": "通过的片段复用；失败片段保留新版本", "nodes": ["reflect", "memory"]}, {"title": "组装画面时间轴", "example": "按 3/4/5/3 秒排列镜头，剪出戴上耳机后进入太空的转场。", "output": "15 秒剪辑时间轴与转场版本", "nodes": ["action", "tool"]}, {"title": "完成音画与字幕合成", "example": "把“进入你的宇宙”对齐太空镜头，结尾放品牌名和产品卖点。", "output": "音轨、字幕、品牌落版与镜头同步", "nodes": ["tool", "result"]}, {"title": "渲染并验收成片", "example": "按需求导出 1920×1080 成片，核对时长、画幅、产品外观和音画同步。", "output": "符合交付规格的视频及验收结果", "nodes": ["reflect", "result"]}, {"title": "交付与保留制作记录", "example": "交付成片、分镜表、素材清单和生成参数，便于修改其中一镜。", "output": "成片地址、工程记录及可追溯版本", "nodes": ["output", "memory"]}]}, {"id": "personal", "cn": "个人", "en": "Personal", "sub": "事件与个人记忆驱动", "case": "案例：规划周末杭州两日游并设置提醒", "goal": "两日杭州旅行 · 示例预算 1500 元", "plan": "偏好 → 查询 → 方案 → 授权 → 执行", "reason": "综合预算、时间、偏好与信息时效", "memory": ["偏好 / 来源 / 置信度", "日程 / 地点 / 本次预算", "候选方案 / 操作状态"], "core": ["融合显式指令与当前情境", "判断授权与主动提醒时机", "具体方案 / 必要数据"], "special": "已有授权内执行 · 必要时等待确认", "tools": ["日历 / 地图查询", "出行预订 / 提醒", "本地应用与文件"], "mcp": ["出行 / 地图服务", "日历 / 消息服务", "文件 / 设备能力"], "reflect": "核对状态 · 防重复 · 检查信息过期", "result": "旅行方案、执行状态与提醒", "steps": [{"title": "理解目标与约束", "example": "“从上海出发，周末杭州两日游，预算 1500 元，少走路。”", "output": "出发地、日期、预算及出行偏好", "nodes": ["goal"]}, {"title": "读取偏好与日程", "example": "读取明确保存的靠窗偏好，检查本周末是否已有其他安排。", "output": "有来源的偏好及当前时间限制", "nodes": ["memory"]}, {"title": "查询车次、酒店与路线", "example": "查询往返车次、地铁附近酒店和西湖周边路线，保留查询时间。", "output": "候选信息；实时价格与库存需实际查询", "nodes": ["tool", "mcp"]}, {"title": "组合并核算方案", "example": "示例：交通 300 + 酒店 500 + 餐饮 300 + 市内 150 = 1250 元。", "output": "示例预算留余量 250 元，形成行程方案", "nodes": ["planner", "reason"]}, {"title": "检查授权与必要确认", "example": "已有授权内设置提醒；若预订超出授权，展示具体订单并等待确认。", "output": "允许直接执行与需要确认的动作范围", "nodes": ["specific"]}, {"title": "执行已授权操作", "example": "按确认方案预约车票或创建日历；没有授权的预订保留为候选。", "output": "订单请求或提醒记录，状态分别保留", "nodes": ["action", "input", "tool"]}, {"title": "核对订单与防重复", "example": "提交超时后先查订单，确认成功再报告，避免重复预订。", "output": "已确认、待处理或失败的真实状态", "nodes": ["reflect"]}, {"title": "创建出发提醒", "example": "在已授权日历中设置“出发前 60 分钟检查证件和乘车站”。", "output": "提醒条目与设定时间", "nodes": ["tool", "result"]}, {"title": "汇总行程和待办", "example": "提供两日路线、预算、订单状态，并指出尚未完成的预订。", "output": "可执行的旅行安排与剩余待办", "nodes": ["output"]}, {"title": "管理记忆与主动服务", "example": "用户确认后保存“偏好地铁附近酒店”；只按授权事件触发提醒。", "output": "可查看、修改、删除的记忆与通知规则", "nodes": ["memory", "specific"]}]}];let scene=0,index=0,timer=null;const fit=document.querySelector('.fit'),page=document.querySelector('.page');function resize(){const scale=Math.min(innerWidth/1920,innerHeight/1080);fit.style.width=(1920*scale)+'px';fit.style.height=(1080*scale)+'px';page.style.transform='scale('+scale+')';}addEventListener('resize',resize);resize();function stop(){if(timer)clearInterval(timer);timer=null;document.getElementById('play').textContent='自动演示';}function draw(){const d=DATA[scene];document.getElementById('scene-name').textContent=d.en+' Agent';document.getElementById('scene-sub').textContent=d.cn+'场景 · '+d.sub;document.getElementById('case-title').textContent=d.case;document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-selected',Number(b.dataset.scene)===scene?'true':'false'));document.querySelectorAll('.left section').forEach((s,i)=>s.hidden=i!==scene);const list=document.getElementById('steps');list.replaceChildren();d.steps.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='step'+(i===index?' current':'');b.setAttribute('aria-current',i===index?'step':'false');const n=document.createElement('span');n.className='number';n.textContent='Step '+(i+1);const c=document.createElement('span');const title=document.createElement('span');title.className='step-title';title.textContent=s.title;const ex=document.createElement('div');ex.className='example';ex.textContent=s.example;c.append(title,ex);b.append(n,c);b.onclick=()=>{stop();index=i;draw();};list.append(b);});document.querySelectorAll('[data-node]').forEach(g=>g.classList.remove('active'));const ids=d.steps[index].nodes;document.querySelectorAll('#diagram-'+scene+' [data-node]').forEach(g=>g.classList.toggle('active',ids.includes(g.dataset.node)));const detail=document.getElementById('detail');detail.replaceChildren();const label=document.createElement('strong');label.textContent='本步产物：';detail.append(label,document.createTextNode(d.steps[index].output));document.getElementById('counter').textContent=(index+1)+' / '+d.steps.length;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===d.steps.length-1;}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{stop();scene=Number(b.dataset.scene);index=0;draw();});document.getElementById('prev').onclick=()=>{stop();index=Math.max(0,index-1);draw();};document.getElementById('next').onclick=()=>{stop();index=Math.min(DATA[scene].steps.length-1,index+1);draw();};document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(index===DATA[scene].steps.length-1){index=0;draw();}document.getElementById('play').textContent='暂停演示';timer=setInterval(()=>{if(index>=DATA[scene].steps.length-1){stop();return;}index++;draw();},4500);};document.getElementById('motion').onclick=function(){document.body.classList.toggle('paused');this.textContent=document.body.classList.contains('paused')?'播放连线':'暂停连线';};draw();</script></html>
